name: Release

# A tag vX.Y.Z builds, tests and packages Horizon CAD on Windows, Linux and
# macOS, writes SHA-256 checksums, and opens a DRAFT GitHub release with them:
# the owner reviews and publishes it. Run by hand (workflow_dispatch) to try
# the packaging without releasing; the artifacts are then kept on the run.
#
# The Windows installer and the macOS disk image are signed (and the disk
# image notarized) when the repository has the secrets for it; without them
# they are not, and the release says so. docs/RELEASING.md lists the secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"

jobs:
  linux:
    name: Linux (tarball and AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tag names the version project() already has: one version.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but project() says ${version}"
            exit 1
          fi

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-x64-linux-${{ hashFiles('vcpkg.json') }}-84bab45d
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-

      - name: Create the vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb-util-dev \
            libxcb-xinput-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            ninja-build \
            pkg-config \
            file \
            qt6-l10n-tools

      # Scripting is not shipped until it is sandboxed (Phase 120). The
      # translations are: a package without them is refused at configure.
      - name: Configure
        # Tests on: the preset turns them off, and the Test step below ran none.
        run: cmake --preset linux-release -DHZ_BUILD_TESTS=ON -DHZ_WARNINGS_AS_ERRORS=ON -DHZ_ENABLE_SCRIPTING=OFF -DHZ_REQUIRE_TRANSLATIONS=ON

      # Kept as soon as vcpkg has installed everything, so a later failure
      # (a test, the packaging) does not throw Qt's build away, as saving at
      # the end of a successful job did: each run built it again.
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/linux-release --config Release

      - name: Test
        run: ctest --test-dir build/linux-release -C Release --output-on-failure

      # What is shipped must start and draw: a Qt with no platform plugin
      # passed every headless test and could not open a window. As in CI.
      - name: Start the application
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          Xvfb :99 -screen 0 1280x1024x24 &
          xvfb=$!
          sleep 2
          set +e
          DISPLAY=:99 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 60 build/linux-release/src/app/horizon --self-test 2>&1 | tee self-test.log
          status=${PIPESTATUS[0]}
          set -e
          kill "${xvfb}"
          # Its fonts found through the system's configuration, not a fallback.
          if grep -q 'Fontconfig error' self-test.log; then
            echo "::error::fontconfig could not load its configuration"
            exit 1
          fi
          test "${status}" -eq 0

      - name: Package a tarball
        run: cpack --config build/linux-release/CPackConfig.cmake -B dist -G TGZ

      - name: Check the tarball carries the translations
        run: |
          expected=$(ls translations/horizon_*.ts | wc -l)
          found=$(tar -tzf dist/*.tar.gz | grep -cE '/translations/horizon_[a-z_]+\.qm$' || true)
          echo "translations: ${found} of ${expected}"
          test "${found}" -eq "${expected}"

      # linuxdeploy's own AppImage needs FUSE, which the runner lacks:
      # APPIMAGE_EXTRACT_AND_RUN runs it without.
      - name: Package an AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          mkdir -p tools
          curl -fsSL -o tools/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x tools/linuxdeploy
          export PATH="${PWD}/tools:${PATH}"
          export OUTPUT="HorizonCAD-${version}-x86_64.AppImage"
          packaging/linux/build-appimage.sh build/linux-release "${PWD}/dist"

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # A step's `if:` cannot read secrets, so whether there are any is said
      # here; only the signing steps are given the secrets themselves.
      HZ_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    outputs:
      signed: ${{ steps.sign-installer.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json') }}-84bab45d
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-

      - name: Create the vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg root and install Ninja
        shell: pwsh
        run: |
          # msvc-dev-cmd points VCPKG_ROOT at the VS-bundled vcpkg; restore
          # the instance run-vcpkg checked out so binary caching works.
          echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
          choco install ninja -y --no-progress

      # vcpkg's Qt is built without its tools; PySide6 brings lrelease. A .qm
      # catalog does not depend on the Qt that compiled it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lrelease
        run: python -m pip install pyside6-essentials

      - name: Configure
        run: cmake --preset ci-windows-release -DHZ_ENABLE_SCRIPTING=OFF -DHZ_REQUIRE_TRANSLATIONS=ON

      # Kept as soon as vcpkg has installed everything, so a later failure
      # (a test, the packaging) does not throw Qt's build away, as saving at
      # the end of a successful job did: each run built it again.
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/ci-windows-release --config Release

      - name: Test
        run: ctest --test-dir build/ci-windows-release -C Release --output-on-failure

      # The executable is signed before it is packed, then the installer.
      # signtool is on the path msvc-dev-cmd set up.
      - name: Sign the executable
        if: env.HZ_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 build/ci-windows-release/src/app/horizon.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # NSIS is no longer on GitHub's Windows images ("Cannot find NSIS
      # compiler makensis"). Its installer records where it is, which is where
      # CPack looks.
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package an installer
        run: cpack --config build/ci-windows-release/CPackConfig.cmake -B dist -G NSIS

      - name: Sign the installer
        id: sign-installer
        if: env.HZ_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          $installer = (Get-ChildItem dist/*.exe).FullName
          signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          signtool verify /pa $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Forget the certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'certificate.pfx') -ErrorAction SilentlyContinue

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS (disk image)
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: arm64-osx
      # As on Windows: whether the secrets are there, not the secrets.
      HZ_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HZ_MACOS_NOTARIZING: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    outputs:
      signed: ${{ steps.package.outputs.signed }}
      notarized: ${{ steps.notarize.outputs.notarized }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-arm64-osx-${{ hashFiles('vcpkg.json') }}-84bab45d
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-osx-

      - name: Create the vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'

      # Qt from Homebrew (with macdeployqt and the Linguist tools), and Ninja.
      - name: Install macOS dependencies
        run: |
          brew install qt ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset macos-release -DHZ_BUILD_TESTS=ON -DHZ_ENABLE_SCRIPTING=OFF -DHZ_REQUIRE_TRANSLATIONS=ON

      # Kept as soon as vcpkg has installed everything, so a later failure
      # (a test, the packaging) does not throw Qt's build away, as saving at
      # the end of a successful job did: each run built it again.
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/macos-release

      - name: Test
        run: ctest --test-dir build/macos-release --output-on-failure --timeout 900

      # The Developer ID certificate in a keychain of this run's own, which
      # codesign finds it in.
      - name: Import the signing certificate
        if: env.HZ_MACOS_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(uuidgen)"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo "${CERTIFICATE}" | base64 --decode > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${password}" "${keychain}"
          # shellcheck disable=SC2046 # the list is one keychain path per word
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${certificate}"

      # Signed with the Developer ID when there is one, ad hoc otherwise
      # (packaging/macos/make-dmg.sh).
      - name: Package a disk image
        id: package
        env:
          HZ_MACOS_SIGNING_IDENTITY: ${{ env.HZ_MACOS_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
        run: |
          packaging/macos/make-dmg.sh build/macos-release "${PWD}/dist"
          if [[ -n "${HZ_MACOS_SIGNING_IDENTITY}" ]]; then echo "signed=true" >> "$GITHUB_OUTPUT"; fi

      # What is shipped must start: the application from the disk image, so
      # with only the Qt macdeployqt put in it. --self-test exits 0 once the
      # viewport has drawn, 3 on a graphics problem.
      - name: Start the application from the disk image
        run: |
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mount}" dist/*.dmg
          set +e
          perl -e 'alarm shift; exec @ARGV' 60 \
            "${mount}/HorizonCAD.app/Contents/MacOS/HorizonCAD" --self-test 2>&1 | tee self-test.log
          status=${PIPESTATUS[0]}
          set -e
          hdiutil detach "${mount}"
          if [[ "${status}" -eq 3 ]]; then
            # The runner is a virtual machine; its OpenGL may not draw.
            echo "::warning::the application started, but its viewport could not draw on this runner"
            exit 0
          fi
          test "${status}" -eq 0

      - name: Notarize the disk image
        id: notarize
        if: env.HZ_MACOS_SIGNING == 'true' && env.HZ_MACOS_NOTARIZING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg=$(ls dist/*.dmg)
          credentials=(--apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}")
          xcrun notarytool submit "${dmg}" "${credentials[@]}" --wait --output-format json > notarization.json
          cat notarization.json
          id=$(python3 -c 'import json; print(json.load(open("notarization.json"))["id"])')
          status=$(python3 -c 'import json; print(json.load(open("notarization.json"))["status"])')
          if [[ "${status}" != "Accepted" ]]; then
            xcrun notarytool log "${id}" "${credentials[@]}"
            echo "::error::notarization ended ${status}"
            exit 1
          fi
          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Forget the signing keychain
        if: always() && env.HZ_MACOS_SIGNING == 'true'
        run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true

      - name: Keep the disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A package that is not signed is said so, above the generated notes,
      # with what a user does to run it.
      - name: Say what is not signed
        env:
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
          MACOS_NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          {
            if [[ "${WINDOWS_SIGNED}" != "true" ]]; then
              echo "- The Windows installer is not signed. Windows SmartScreen warns before it runs: choose **More info**, then **Run anyway**."
            fi
            if [[ "${MACOS_SIGNED}" != "true" ]]; then
              echo "- The macOS disk image is not signed or notarized, so macOS will not open the application at first. After the first try, open **System Settings ▸ Privacy & Security** and choose **Open Anyway**."
            elif [[ "${MACOS_NOTARIZED}" != "true" ]]; then
              echo "- The macOS disk image is signed but not notarized, so macOS will not open the application at first. After the first try, open **System Settings ▸ Privacy & Security** and choose **Open Anyway**."
            fi
          } > unsigned.md
          cat unsigned.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Horizon CAD ${GITHUB_REF_NAME#v}" \
            --notes-file unsigned.md \
            --generate-notes
